<!DOCTYPE html>
<html>
<head>
    <title>Distributed Live Stream</title>
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    <style>
        body {
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }
        h1 { margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>🔴 Live Stream: testStream</h1>

    <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto" width="800" height="450">
        <source src="/stream/testStream.m3u8" type="application/x-mpegURL">
        
        <p class="vjs-no-js">
            To view this video please enable JavaScript, and consider upgrading to a web browser that
            <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
        </p>
    </video>

    <ul id="stream-list"></ul>

    <script src="https://vjs.zencdn.net/8.6.1/video.min.js">
        fetch('/streams')
            .then(response => response.json())
            .then(streams => {
                const list = document.getElementById('stream-list');
                streams.forEach(stream => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '#';
                    link.textContent = stream;
                    link.onclick = () => changeStream(stream);
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });
            });

        function changeStream(name){
            var player = videojs('my-video');
            player.src({ 
                src: '/stream/' + name + '.m3u8',
                type: 'application/x-mpegURL'
            });
            player.play();
        }
    </script>

</body>
</html>
